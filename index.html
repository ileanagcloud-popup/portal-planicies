<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- METADATOS PARA REDES SOCIALES Y BUSCADORES -->
    <meta name="description" content="Tu comunidad en un solo lugar. Consulta pagos, noticias y servicios de Planicies I de forma rápida y segura.">
    <meta name="keywords" content="Planicies I, Residentes, Portal Vecinos, Mantenimiento, Administración">
    <meta name="author" content="Mesa Directiva Planicies I">

    <!-- Open Graph / Facebook / WhatsApp (Así se ve cuando compartes el link) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.tudominio.com/"> <!-- CAMBIA ESTO POR TU DOMINIO FINAL -->
    <meta property="og:title" content="Portal de Residentes | Planicies I">
    <meta property="og:description" content="Accede a comunicados, finanzas y reglamentos de nuestra comunidad.">
    <meta property="og:image" content="https://ui-avatars.com/api/?name=P+1&background=0D8ABC&color=fff&size=512"> <!-- Genera una imagen previa automática -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.tudominio.com/"> <!-- CAMBIA ESTO -->
    <meta property="twitter:title" content="Portal de Residentes | Planicies I">
    <meta property="twitter:description" content="Accede a comunicados, finanzas y reglamentos de nuestra comunidad.">
    <meta property="twitter:image" content="https://ui-avatars.com/api/?name=P+1&background=0D8ABC&color=fff&size=512">
    <title>Portal de Residentes | Planicies I</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Ícono en la pestaña del navegador (Favicon) -->
<link rel="icon" href="https://ui-avatars.com/api/?name=P+1&background=3b82f6&color=fff&rounded=true" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' }
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Ocultar contenido hasta autenticar */
        #app-container { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen overflow-hidden">

    <!-- PANTALLA DE BLOQUEO (LOGIN) -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl text-center">
            <div class="w-16 h-16 bg-primary-600 rounded-xl mx-auto flex items-center justify-center text-white text-2xl font-bold mb-4 shadow-lg shadow-primary-500/30">
                P1
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Portal de Vecinos</h2>
            <p class="text-slate-500 mb-6 text-sm">Esta información es privada y exclusiva para residentes de Planicies I.</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <input type="password" id="password-input" 
                        class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:border-primary-500 focus:ring-2 focus:ring-primary-200 outline-none transition-all text-center text-lg tracking-widest"
                        placeholder="Ingresa la clave de acceso" required>
                </div>
                <button type="submit" 
                    class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-lock-open"></i> Acceder
                </button>
                <p id="login-error" class="text-red-500 text-sm hidden font-medium mt-2">
                    <i class="fas fa-times-circle mr-1"></i> Contraseña incorrecta
                </p>
            </form>
            <p class="mt-6 text-xs text-slate-400">¿Eres nuevo residente? Solicita la clave en la caseta de vigilancia.</p>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL (Oculto inicialmente) -->
    <div id="app-container" class="h-full flex">
        <!-- SIDEBAR -->
        <aside class="hidden md:flex flex-col w-64 bg-slate-900 text-white h-full shadow-xl transition-all z-20">
            <div class="p-6 border-b border-slate-800 flex items-center gap-3">
                <div class="w-10 h-10 bg-primary-600 rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-primary-500/30">P1</div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight">Planicies I</h1>
                    <p class="text-xs text-slate-400">Portal de Vecinos</p>
                </div>
            </div>
            <nav class="flex-1 overflow-y-auto py-4" id="sidebar-menu"></nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="logout()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded flex items-center justify-center gap-2 text-sm transition-colors">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </aside>

        <!-- MAIN WRAPPER -->
        <div class="flex-1 flex flex-col h-full relative overflow-hidden">
            <header class="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center shadow-md z-30">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-primary-600 rounded flex items-center justify-center font-bold">P1</div>
                    <span class="font-bold">Planicies I</span>
                </div>
                <button id="mobile-menu-btn" class="text-white focus:outline-none"><i class="fas fa-bars text-xl"></i></button>
            </header>
            
            <div id="mobile-menu" class="absolute inset-0 bg-slate-900 z-40 transform translate-x-full transition-transform duration-300 md:hidden flex flex-col pt-16">
                <nav class="flex-1 overflow-y-auto px-4" id="mobile-sidebar-menu"></nav>
                <div class="p-4 border-t border-slate-800">
                     <button onclick="logout()" class="w-full bg-slate-800 text-slate-300 py-3 rounded text-center">Cerrar Sesión</button>
                </div>
            </div>

            <main class="flex-1 overflow-y-auto p-4 md:p-8 relative" id="main-content"></main>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 transition-transform duration-300 flex items-center gap-3 z-50">
        <i class="fas fa-check-circle text-green-400"></i> <span id="toast-message">Copiado</span>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DE SEGURIDAD
        // ==========================================
        
        
        const ACCESS_HASH = "69b1df8bf0937f6706c43526950c80f67de61435c9f0991753e07234e814df6e"; 

        async function handleLogin(e) {
            e.preventDefault();
            const input = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('login-error');
            
            // Generar hash del input
            const msgBuffer = new TextEncoder().encode(input);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (hashHex === ACCESS_HASH) {
                // Éxito
                localStorage.setItem('p1_session', 'true');
                showApp();
            } else {
                // Error
                errorMsg.classList.remove('hidden');
                document.getElementById('password-input').value = '';
                document.getElementById('password-input').focus();
            }
        }

        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex'; // Activar Flex
            document.getElementById('app-container').classList.add('fade-in');
            renderMenu();
            navigate('dashboard');
        }

        function checkSession() {
            if(localStorage.getItem('p1_session') === 'true') {
                showApp();
            }
        }

        function logout() {
            localStorage.removeItem('p1_session');
            location.reload();
        }

        // ==========================================
        // 2. BASE DE DATOS (DATA)
        // ==========================================
        const COMMUNITY_DATA = {
            general: { name: "Residencial Planicies I", lastUpdate: "26 Enero 2026", adminContact: "administracion@planiciesuno.org" },
            menu: [
                { id: 'dashboard', label: 'Inicio', icon: 'fa-home', type: 'dashboard' },
                { id: 'news', label: 'Comunicados', icon: 'fa-newspaper', type: 'news' },
                { id: 'payments', label: 'Pagos y Finanzas', icon: 'fa-credit-card', type: 'payments' },
                { id: 'calendar', label: 'Calendario', icon: 'fa-calendar-alt', type: 'calendar' },
                { id: 'docs', label: 'Documentación', icon: 'fa-folder-open', type: 'docs' },
                { id: 'access', label: 'Guía y Accesos', icon: 'fa-id-card', type: 'faq' }
            ],
            dashboard: {
                alerts: [
                    { type: 'warning', text: 'Automatización de control de acceso en curso, conducir con precacuión al entrar.' },
                    { type: 'info', text: 'Recuerda enviar tu comprobante de pago antes del día 11.' }
                ],
                stats: { labels: ['Al Corriente', 'Con Adeudo', 'Convenio', 'No escrituradas'], data: [91, 2, 1, 48] },
                quickLinks: [
                    { title: 'Reportar Incidencia', icon: 'fa-exclamation-triangle', color: 'bg-amber-100 text-amber-600', action: 'mailto:administracion@planiciesuno.org?subject=Reporte' },
                    { title: 'Reglamento Rápido', icon: 'fa-book', color: 'bg-primary-100 text-primary-600', action: '#docs' },
                    { title: 'Chat Vecinos', icon: 'fa-comments', color: 'bg-green-100 text-green-600', action: 'https://chat.whatsapp.com/BSg709CnYtF7dXfKPFqJ9H' }
                ]
            },
            news: [
                { title: "Próxima Asamblea 2026", date: "29 Enero 2026", category: "Administración", content: "Modificación al reglamento interno anterior.", important: true },
                { title: "Cambio de proveedor de jardinería", date: "14 Enero 2026", category: "Servicios", content: "A partir de enero, 'Alta Jardinería' se encargará de las áreas comunes.", important: false }
            ],
            payments: {
                monthlyFee: "$950.00 MXN",
                warning: "Para transferencias interbancarias (SPEI). Asegúrese de que el beneficiario coincida.",
                bankAccounts: [
                    { bank: "BBVA", owner: "Asociación de Vecinos del Fraccionamiento Planicies 1, AC", clabe: "012580001260519440"},                    
                ],                
                referenceRule: "CALLE + NUMERO (Ej: TUNDRA 100, TUN100)",
                instructions: "Sin esta referencia, su pago podría no ser identificado y generará recargos."
            },
            calendar: [
                { day: "Lunes", activities: ["Limpieza en Casa Club"] },
                { day: "Martes", activities: ["Recolección de Basura (Tarde)", "Alberca Cerrada Mantenimiento Profundo"] },
                { day: "Miércoles", activities: ["Libre"] },
                { day: "Jueves", activities: ["Recolección de Basura (Tarde)", "Jardinería en parque principal y alrededores"] },
                { day: "Viernes", activities: ["Mantenimiento alberca 9:00 am a 10:00 am"] },
                { day: "Sábado", activities: ["Recolección de Basura (Mediodía)"] },
                
            ],
            docs: [
                { name: "Reglamento Interno 2024", type: "PDF", size: "Online", url: "https://drive.google.com/file/d/17-4HLt7mXDrpmIUH_uaiugppQjqaoezn/view?usp=drive_link" },
                { name: "Aviso de Privacidad", type: "PDF", size: "Online", url: "https://sway.cloud.microsoft/J1ZnjuoysMZl1wSG" }
            ],
            access: [
                { q: "¿Cómo solicito un TAG?", a: "Acudir a caseta Lunes o Miércoles de 9am a 1pm." },
                { q: "¿Horario mudanzas?", a: "Lunes a Sábado de 9am a 6pm." }
            ]
        };

        // ==========================================
        // 3. LÓGICA UI
        // ==========================================
        const mainContent = document.getElementById('main-content');
        let currentChart = null;

        document.addEventListener('DOMContentLoaded', () => {
            checkSession(); // Verificar si ya inició sesión
            document.getElementById('mobile-menu-btn').addEventListener('click', toggleMobileMenu);
        });

        function renderMenu() {
            const createLink = (item) => `
                <a href="#" onclick="navigate('${item.id}'); toggleMobileMenu(true); return false;" 
                   class="nav-item flex items-center px-6 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition-colors border-l-4 border-transparent hover:border-primary-500"
                   data-id="${item.id}">
                    <i class="fas ${item.icon} w-6 text-center"></i>
                    <span class="ml-3 font-medium">${item.label}</span>
                </a>`;
            const menuHtml = COMMUNITY_DATA.menu.map(createLink).join('');
            document.getElementById('sidebar-menu').innerHTML = menuHtml;
            document.getElementById('mobile-sidebar-menu').innerHTML = menuHtml;
        }

        function navigate(viewId) {
            document.querySelectorAll('.nav-item').forEach(el => {
                if(el.dataset.id === viewId) {
                    el.classList.add('bg-slate-800', 'text-white', 'border-primary-500');
                    el.classList.remove('border-transparent', 'text-slate-300');
                } else {
                    el.classList.remove('bg-slate-800', 'text-white', 'border-primary-500');
                    el.classList.add('border-transparent', 'text-slate-300');
                }
            });
            mainContent.innerHTML = `<div class="fade-in max-w-5xl mx-auto pb-10">${generateViewHTML(viewId)}</div>`;
            if(viewId === 'dashboard') initDashboardChart();
        }

        function generateViewHTML(viewId) {
            const data = COMMUNITY_DATA;
            const header = (title, sub) => `<div class="mb-8"><h2 class="text-3xl font-bold text-slate-800">${title}</h2><p class="text-slate-500 mt-1">${sub}</p></div>`;

            if(viewId === 'dashboard') {
                return `
                    ${header(`Bienvenido a ${data.general.name}`, `Última actualización: ${data.general.lastUpdate}`)}
                    <div class="grid gap-4 mb-8">
                        ${data.dashboard.alerts.map(a => `<div class="p-4 rounded-lg border-l-4 flex gap-3 shadow-sm ${a.type === 'warning' ? 'bg-amber-50 border-amber-500 text-amber-800' : 'bg-blue-50 border-blue-500 text-blue-800'}"><i class="fas ${a.type === 'warning' ? 'fa-exclamation-circle' : 'fa-info-circle'} mt-1"></i><p class="font-medium">${a.text}</p></div>`).join('')}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-100"><h3 class="text-lg font-bold mb-4 text-slate-700">Estado de la Comunidad</h3><div class="h-64"><canvas id="statusChart"></canvas></div></div>
                        <!-- Links Rápidos -->
                        <div class="space-y-4">
                            ${data.dashboard.quickLinks.map(link => {
                                // LÓGICA NUEVA: Detectar si es link interno (#) o externo
                                const isInternal = link.action.startsWith('#');
                                // Si es interno (#docs), usamos la función navigate(). Si es externo, dejamos el link normal.
                                const clickAction = isInternal ? `onclick="navigate('${link.action.substring(1)}'); return false;"` : '';
                                const href = isInternal ? '#' : link.action;
                                const target = isInternal ? '' : 'target="_blank"'; // Abre externos en nueva pestaña
                                
                                return `
                                <a href="${href}" ${clickAction} ${target} class="block bg-white p-4 rounded-xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow flex items-center gap-4 group">
                                    <div class="w-12 h-12 rounded-full flex items-center justify-center text-lg ${link.color}">
                                        <i class="fas ${link.icon}"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-slate-700 group-hover:text-primary-600 transition-colors">${link.title}</h4>
                                        <span class="text-xs text-slate-400">Clic para acceder</span>
                                    </div>
                                </a>
                            `}).join('')}
                        </div>   
                    </div>`;
            }
            if(viewId === 'payments') {
                return `
                    ${header('Información Financiera', 'Datos para pago de mantenimiento.')}
                    
                    <!-- 1. Cuota Mensual -->
                    <div class="bg-primary-50 rounded-xl p-6 mb-6 border border-primary-100 flex items-center gap-4">
                        <div class="p-3 bg-white rounded-full text-primary-600 shadow-sm"><i class="fas fa-coins text-2xl"></i></div>
                        <div>
                            <p class="text-sm text-primary-600 font-semibold uppercase tracking-wider">Cuota Mensual 2026</p>
                            <p class="text-3xl font-bold text-slate-800">${data.payments.monthlyFee}</p>
                        </div>
                    </div>

                    <!-- 2. REGLAS DE REFERENCIA (IMPORTANTE) -->
                    <div class="bg-amber-50 border-l-4 border-amber-500 p-5 mb-8 rounded-r-lg shadow-sm">
                        <div class="flex flex-col sm:flex-row sm:items-start gap-4">
                            <div class="text-amber-500 text-xl"><i class="fas fa-exclamation-triangle"></i></div>
                            <div class="flex-1">
                                <h3 class="font-bold text-amber-900 mb-1">Instrucciones de Identificación</h3>
                                <p class="text-sm text-amber-800 mb-3">${data.payments.instructions}</p>
                                
                                <div class="bg-white/80 p-3 rounded border border-amber-200 inline-block w-full sm:w-auto">
                                    <p class="text-xs text-amber-600 uppercase font-bold mb-1">Concepto / Referencia Obligatoria:</p>
                                    <div class="flex items-center gap-2">
                                        <code class="font-mono font-bold text-lg text-slate-800">${data.payments.referenceRule}</code>
                                        <button onclick="copyToClipboard('${data.payments.referenceRule}')" class="text-amber-600 hover:text-amber-800 px-2" title="Copiar regla">
                                            <i class="far fa-copy"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Tarjetas de Bancos -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${data.payments.bankAccounts.map(acc => `
                            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:border-primary-300 transition-colors group relative overflow-hidden">
                                <div class="absolute top-0 right-0 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                                    <i class="fas fa-university text-6xl text-slate-400"></i>
                                </div>
                                
                                <h3 class="text-xl font-bold text-slate-700 mb-4 border-b pb-2">${acc.bank}</h3>
                                
                                <div class="space-y-3 relative z-10">
                                    <div>
                                        <p class="text-xs text-slate-400 uppercase tracking-wide">Beneficiario</p>
                                        <p class="font-medium text-slate-800">${acc.owner}</p>
                                    </div>
                                    
                                    <div>
                                        <p class="text-xs text-slate-400 uppercase tracking-wide">CLABE (Interbancaria)</p>
                                        <div class="flex items-center gap-2 bg-slate-50 p-2 rounded border border-slate-100">
                                            <code class="font-mono text-primary-700 font-bold flex-1">${acc.clabe}</code>
                                            <button onclick="copyToClipboard('${acc.clabe}')" class="text-slate-400 hover:text-primary-600 transition-colors p-1">
                                                <i class="far fa-copy text-lg"></i>
                                            </button>
                                        </div>
                                    </div>

                                    ${acc.account ? `
                                    <div>
                                        <p class="text-xs text-slate-400 uppercase tracking-wide">Número de Cuenta</p>
                                        <div class="flex items-center gap-2">
                                            <code class="font-mono text-slate-600">${acc.account}</code>
                                            <button onclick="copyToClipboard('${acc.account}')" class="text-slate-400 hover:text-primary-600 p-1">
                                                <i class="far fa-copy"></i>
                                            </button>
                                        </div>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            // (Simplificado para brevedad - el resto de vistas siguen la lógica anterior)
            if(viewId === 'news') return `${header('Comunicados', '')}<div class="space-y-6">${data.news.map(n => `<div class="bg-white rounded-xl p-6 shadow-sm border border-slate-100 ${n.important ? 'border-l-4 border-l-primary-500' : ''}"><h3 class="text-xl font-bold text-slate-800">${n.title}</h3><p class="text-slate-600 mt-2">${n.content}</p></div>`).join('')}</div>`;
            if(viewId === 'calendar') return `${header('Calendario', '')}<div class="bg-white rounded-xl shadow-sm border border-slate-200 divide-y divide-slate-100">${data.calendar.map(d => `<div class="p-6 flex flex-col sm:flex-row sm:items-center"><span class="w-32 font-bold text-slate-800">${d.day}</span><div>${d.activities.map(a => `<div class="flex items-center gap-2"><i class="fas fa-check text-green-500 text-xs"></i><span class="text-slate-600">${a}</span></div>`).join('')}</div></div>`).join('')}</div>`;
            if(viewId === 'docs') return `${header('Documentos', '')}<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${data.docs.map(d => `<a href="${d.url}" class="flex items-center p-4 bg-white rounded-xl shadow-sm border border-slate-200 hover:border-primary-400 transition-all"><i class="fas fa-file-pdf text-2xl text-slate-400 mr-4"></i><div><h4 class="font-semibold text-slate-700">${d.name}</h4><p class="text-xs text-slate-400">${d.size}</p></div></a>`).join('')}</div>`;
            if(viewId === 'access') return `${header('Accesos & FAQ', '')}<div class="space-y-4">${data.access.map((item,i) => `<div class="bg-white rounded-xl border border-slate-200 overflow-hidden"><button class="w-full text-left p-5 flex justify-between items-center font-bold text-slate-700" onclick="toggleAccordion('faq-${i}')">${item.q} <i class="fas fa-chevron-down text-slate-400" id="icon-faq-${i}"></i></button><div id="faq-${i}" class="hidden px-5 pb-5 text-slate-600 bg-slate-50 border-t border-slate-100 text-sm">${item.a}</div></div>`).join('')}</div>`;
            return `<div class="text-center p-10">Cargando...</div>`;
        }

        function initDashboardChart() {
            const ctx = document.getElementById('statusChart').getContext('2d');
            if (currentChart) currentChart.destroy();
            currentChart = new Chart(ctx, { type: 'doughnut', data: { labels: COMMUNITY_DATA.dashboard.stats.labels, datasets: [{ data: COMMUNITY_DATA.dashboard.stats.data, backgroundColor: ['#008f39','#ef4444','#f59e0b','#3b82f6'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } }, cutout: '70%' } });
        }
        function copyToClipboard(text) { navigator.clipboard.writeText(text).then(() => { const t = document.getElementById('toast'); t.classList.remove('translate-y-20'); setTimeout(() => t.classList.add('translate-y-20'), 3000); }); }
        function toggleAccordion(id) { document.getElementById(id).classList.toggle('hidden'); document.getElementById('icon-'+id).classList.toggle('rotate-180'); }
        function toggleMobileMenu(f) { const m = document.getElementById('mobile-menu'); f===true ? m.classList.add('translate-x-full') : m.classList.toggle('translate-x-full'); }
    </script>
</body>
</html>
